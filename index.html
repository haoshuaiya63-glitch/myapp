<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>测试App</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    h3 { margin: 0 0 12px; font-size: 16px; color: #333; }
    button { padding: 10px 20px; margin-right: 8px; margin-bottom: 8px; border-radius: 8px; border: none; background: #007aff; color: white; font-size: 14px; cursor: pointer; }
    button:disabled { background: #ccc; }
    button.stop { background: #ff3b30; }
    .status { margin-top: 10px; padding: 10px; background: #f0f0f0; border-radius: 8px; font-size: 13px; color: #555; min-height: 36px; white-space: pre-line; }
  </style>
</head>
<body>

<div class="card">
  <h3>🎤 录音测试</h3>
  <button id="btn-start" onclick="startRec()">开始录音</button>
  <button id="btn-stop" class="stop" onclick="stopRec()" disabled>停止</button>
  <button id="btn-play" onclick="playRec()" disabled>播放</button>
  <div class="status" id="rec-status">等待初始化...</div>
</div>

<div class="card">
  <h3>📍 定位测试</h3>
  <button onclick="getLocation()">获取位置</button>
  <button onclick="watchLocation()" id="btn-watch">持续追踪</button>
  <button class="stop" onclick="stopWatch()" id="btn-stop-watch" disabled>停止追踪</button>
  <div class="status" id="geo-status">等待初始化...</div>
</div>

<script src="cordova.js"></script>
<script>
  let mediaFile = null, watchId = null;
  const recFile = 'cdvfile://localhost/temporary/recording.mp3';

  document.addEventListener('deviceready', function() {
    var p = cordova.plugins.permissions;

    // 请求所有权限
    p.requestPermissions([
      p.RECORD_AUDIO,
      p.ACCESS_FINE_LOCATION,
      p.ACCESS_COARSE_LOCATION
    ], function(status) {
      if (status.hasPermission) {
        document.getElementById('rec-status').textContent = '权限已获取，可以开始录音';
        document.getElementById('geo-status').textContent = '权限已获取，可以获取位置';
      } else {
        document.getElementById('rec-status').textContent = '部分权限被拒绝，请去设置里开启';
        document.getElementById('geo-status').textContent = '部分权限被拒绝，请去设置里开启';
      }
    }, function() {
      document.getElementById('rec-status').textContent = '请求权限失败';
      document.getElementById('geo-status').textContent = '请求权限失败';
    });

  }, false);

  function startRec() {
    mediaFile = new Media(recFile,
      function() {
        document.getElementById('rec-status').textContent = '录音完成，点播放收听';
        document.getElementById('btn-play').disabled = false;
        document.getElementById('btn-start').disabled = false;
        document.getElementById('btn-stop').disabled = true;
      },
      function(err) {
        document.getElementById('rec-status').textContent = '录音错误：' + err.message;
      }
    );
    mediaFile.startRecord();
    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-stop').disabled = false;
    document.getElementById('rec-status').textContent = '录音中...';
  }

  function stopRec() {
    if (mediaFile) mediaFile.stopRecord();
  }

  function playRec() {
    var player = new Media(recFile,
      function() { document.getElementById('rec-status').textContent = '播放完成'; },
      function(err) { document.getElementById('rec-status').textContent = '播放错误：' + err.message; }
    );
    player.play();
    document.getElementById('rec-status').textContent = '播放中...';
  }

  function getLocation() {
    document.getElementById('geo-status').textContent = '获取中...';
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        const { latitude, longitude, accuracy } = pos.coords;
        document.getElementById('geo-status').textContent =
          '纬度：' + latitude.toFixed(6) +
          '\n经度：' + longitude.toFixed(6) +
          '\n精度：±' + Math.round(accuracy) + ' 米';
      },
      function(err) {
        document.getElementById('geo-status').textContent = '失败：' + err.message;
      },
      { enableHighAccuracy: true }
    );
  }

  function watchLocation() {
    document.getElementById('btn-watch').disabled = true;
    document.getElementById('btn-stop-watch').disabled = false;
    watchId = navigator.geolocation.watchPosition(
      function(pos) {
        const { latitude, longitude, accuracy } = pos.coords;
        const t = new Date().toLocaleTimeString();
        document.getElementById('geo-status').textContent =
          '[' + t + '] 纬度：' + latitude.toFixed(6) +
          '\n经度：' + longitude.toFixed(6) +
          '\n精度：±' + Math.round(accuracy) + ' 米';
      },
      function(err) {
        document.getElementById('geo-status').textContent = '失败：' + err.message;
      },
      { enableHighAccuracy: true }
    );
  }

  function stopWatch() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    document.getElementById('btn-watch').disabled = false;
    document.getElementById('btn-stop-watch').disabled = true;
  }
</script>
</body>
</html>
