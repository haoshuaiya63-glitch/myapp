name: Build Android APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: cordova create cordova-app com.yourname.myapp MyApp

      - name: Copy www files
        run: |
          rm -rf cordova-app/www/*
          cp index.html cordova-app/www/

      - name: Copy config.xml
        run: cp config.xml cordova-app/config.xml

      - name: Add Android platform
        working-directory: cordova-app
        run: cordova platform add android

      - name: Build Debug APK
        working-directory: cordova-app
        run: cordova build android --debug

      - name: List APK files
        run: find cordova-app/platforms/android -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/
